apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
data:
  config.json: |
    {
      "API_URL": "/"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: rmavani/3tier-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: ui-config-volume
              mountPath: /usr/share/nginx/html/config/config.json
              subPath: config.json
      volumes:
        - name: ui-config-volume
          configMap:
            name: ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
