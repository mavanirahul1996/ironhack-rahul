apiVersion: v1
kind: Secret
metadata:
  name: api-secret
type: Opaque
stringData:
  CONNECTION_STRING: "Host=postgres-service;Port=5432;Database=basic3tier;Username=postgres;Password=admin123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: rmavani/basic3tier-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__Basic3Tier
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: CONNECTION_STRING
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
