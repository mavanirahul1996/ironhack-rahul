services:
  vote:
    image: rmavani/ironhack-project1/vote-app:latest
    build: ./vote
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - back-tier

  result:
    image: rmavani/ironhack-project1/result-app:latest
    build: ./result
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:4000"
    networks:
      - back-tier

  worker:
    image: rmavani/ironhack-project1/worker-app:latest
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: [ "CMD", "sh", "/healthchecks/redis.sh" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: [ "CMD", "sh", "/healthchecks/postgres.sh" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier

volumes:
  db-data:

networks:
  back-tier:
