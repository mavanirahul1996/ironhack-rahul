
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app-container
          image: rmavani/my-java-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
