# Loki 3.7 — single binary, filesystem storage. Lab only, NOT production.
auth_enabled: false            # single tenant ("fake"). Production: true + X-Scope-OrgID

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb               # the only index you should use today
      object_store: filesystem  # production: s3 / gcs / azure
      schema: v13               # required for structured metadata
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true          # /index/volume API (Drilldown)
  retention_period: 72h         # enforced by the compactor
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_label_names_per_series: 15
  ingestion_rate_mb: 8
  max_global_streams_per_user: 5000
  discover_log_levels: true     # adds detected_level structured metadata

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true                 # powers log patterns (Logs Drilldown)

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /tmp/loki/rules-temp
  enable_api: true
  evaluation_interval: 10s
  wal:
    dir: /loki/ruler-wal
  remote_write:
    enabled: true
    client:
      url: http://prometheus:9090/api/v1/write

analytics:
  reporting_enabled: false
