---
- name: Install Apache and proxy modules
  apt:
    name:
      - apache2
      - libapache2-mod-proxy-html  # brings in proxy_* mods
  state: present
  update_cache: yes
  become: true
 
- name: Enable required proxy modules
  command: a2enmod proxy proxy_http proxy_balancer lbmethod_byrequests
  become: true
  notify: Restart Apache
  changed_when: "'already enabled' not in ansible_stdout"
 
- name: Deploy load balancer vhost
  template:
    src: loadbalancer.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf
    mode: '0644'
  become: true
  notify: Restart Apache