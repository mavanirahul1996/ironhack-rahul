apiVersion: apps/v1
kind: Deployment
metadata:
  name: confetti-deployment
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: confetti
  template:
    metadata:
      labels:
        app: confetti
    spec:
      containers:
      - name: confetti-container
        image: myrepo/confetti-app:v1
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5