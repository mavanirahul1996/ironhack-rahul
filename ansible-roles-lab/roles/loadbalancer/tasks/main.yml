---
- name: Install Apache and load balancing modules
  ansible.builtin.apt:
    name:
      - apache2
    state: present
    update_cache: true
  become: true

- name: Enable required Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_http
    - proxy_balancer
    - lbmethod_byrequests
  become: true
  notify: Restart Apache

- name: Deploy load balancer configuration
  ansible.builtin.template:
    src: loadbalancer.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf
    mode: '0644'
  become: true
  notify: Restart Apache
