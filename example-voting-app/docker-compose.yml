services:

  # FRONTEND
  vote:
    image: dockersamples/examplevotingapp_vote
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - front-tier
      - back-tier

  # BACKEND / RESULT
  result:
    image: dockersamples/examplevotingapp_result
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    networks:
      - front-tier
      - back-tier

  # BACKEND WORKER
  worker:
    image: dockersamples/examplevotingapp_worker
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier

  # CACHE
  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  # DATABASE
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

# DATABASE STORAGE
volumes:
  db-data:

    # NETWORKS
networks:
  front-tier:
  back-tier:
